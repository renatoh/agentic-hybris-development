# customservices.key=value

# Specifies the location of the spring context file putted automatically to the global platform application context.
customservices.application-context=customservices-spring.xml


# -----------------------------------------------------------------------
# NET-8938 - My Account order history from an external REST endpoint
# -----------------------------------------------------------------------
# All four properties are read through the ConfigurationService and are resolved per call,
# so they can be changed in HAC without a server restart.

# Base URL of the external order history endpoint. The service appends the query parameter
# ?customerNumber=<customer number>. Empty by default: the environment specific value belongs
# in config/local.properties, never in the Java code and never in this file.
customservices.orderhistory.rest.endpoint.url=

# Connect timeout in milliseconds for the call to the external order history endpoint.
customservices.orderhistory.rest.connect.timeout.ms=5000

# Read timeout in milliseconds for the call to the external order history endpoint.
customservices.orderhistory.rest.read.timeout.ms=10000

# Classpath location of the bundled mock payload used by mockCustomOrderHistoryService.
customservices.orderhistory.mock.resource=/mockorderhistory/order_history_mock.json


# -----------------------------------------------------------------------
# NET-8939 - Nightly competitor pricing import
# -----------------------------------------------------------------------
# All properties are read through the ConfigurationService and resolved per job run, so the
# endpoint can be switched in HAC without a server restart.

# Base URL of the external competitor pricing endpoint. Empty by default: the environment specific
# value belongs in config/local.properties, never in the Java code and never in this file.
customservices.competitorpricing.rest.endpoint.url=

# Connect timeout in milliseconds for the call to the external competitor pricing endpoint.
customservices.competitorpricing.rest.connect.timeout.ms=5000

# Read timeout in milliseconds for the call to the external competitor pricing endpoint.
customservices.competitorpricing.rest.read.timeout.ms=10000

# Classpath location of the bundled mock payload used by mockCompetitorPricingService.
customservices.competitorpricing.mock.resource=/competitorpricing/competitor_pricing_mock.json

# No catalog/tenant property exists here (NET-8939 revised, multi-tenant design) - a single global
# catalog/version pair would not survive a second store. tenantId and catalogVersion are per
# CompetitorPricingImportCronJob-instance attributes instead; see
# resources/impex/customservices-competitorpricing-cronjob.impex.


# -----------------------------------------------------------------------
# NET-8940 - Session-scoped product comparison lists
# -----------------------------------------------------------------------
# Category-tree depth, counted from the first real navigation category below the catalog's
# synthetic root (depth 1 = that first real category, e.g. "Cameras"; the synthetic root itself is
# excluded from counting) at which a product's "grouping category" is resolved - two products only
# ever share a comparison list if they resolve to the same category at this depth.
# Read fresh on every call via ConfigurationService, never hardcoded in resolution code, so this
# can be changed in HAC (e.g. to 3, to group by L3) without a code change or a restart.
# No catalog/store id belongs here - grouping is resolved from each request's own session
# CatalogVersionModel, never a global catalog assumption (see the sap-commerce-cloud skill).
customservices.productcomparison.grouping.category.depth=3
